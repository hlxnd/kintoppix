name: Daily Rebuild

on:
  schedule:
    - cron: '0 5 * * *'  # 5am UTC daily
  workflow_dispatch:       # allow manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore TMDB cache
        uses: actions/cache/restore@v4
        with:
          path: cache/
          key: tmdb-cache-${{ github.run_id }}
          restore-keys: tmdb-cache-

      - name: Fetch mediathek data
        run: bash update.sh

      - name: Build
        run: node build.js

      - name: Save TMDB cache
        uses: actions/cache/save@v4
        with:
          path: cache/
          key: tmdb-cache-${{ github.run_id }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f content.js index.html
          git diff --staged --quiet || git commit -m "Daily rebuild $(date -u +%Y-%m-%d)"
          git push
