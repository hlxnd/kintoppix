name: Daily Rebuild

on:
  schedule:
    - cron: '0 5 * * *'  # 5am UTC daily
  workflow_dispatch:       # allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore TMDB cache
        uses: actions/cache/restore@v4
        with:
          path: cache/
          key: tmdb-cache-${{ github.run_id }}
          restore-keys: tmdb-cache-

      - name: Fetch mediathek data
        run: bash update.sh

      - name: Build
        run: node build.js
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Save TMDB cache
        uses: actions/cache/save@v4
        with:
          path: cache/
          key: tmdb-cache-${{ github.run_id }}

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html info.html style.css app.js robots.txt .nojekyll content.js _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
