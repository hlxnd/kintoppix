<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MWJW – Free Movies</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e5e5e5;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      background: #0f0f0f;
      padding: 18px 32px;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
    }

    header span {
      font-size: 0.85rem;
      color: #888;
      margin-left: 12px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }

    #search {
      background: #222;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e5e5e5;
      font-size: 0.9rem;
      padding: 7px 14px;
      width: 240px;
      outline: none;
    }

    #search::placeholder { color: #555; }
    #search:focus { border-color: #555; }

    .dropdown {
      position: relative;
    }

    .dropdown-btn {
      background: #222;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e5e5e5;
      font-size: 0.9rem;
      padding: 7px 14px;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }

    .dropdown-btn:hover { border-color: #555; }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 8px 0;
      z-index: 100;
      min-width: 140px;
    }

    .dropdown.open .dropdown-menu { display: block; }

    .dropdown-menu label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #ccc;
      white-space: nowrap;
    }

    .dropdown-menu label:hover { background: #222; color: #fff; }
    .dropdown-menu input[type=checkbox] { accent-color: #e5e5e5; }

    main {
      padding: 32px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    .poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      background: #2a2a2a;
    }

    .poster-placeholder {
      width: 100%;
      aspect-ratio: 2/3;
      background: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: #555;
      text-align: center;
      padding: 12px;
    }

    .card-info {
      padding: 8px 10px 10px;
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e5e5e5;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .rating {
      font-size: 0.72rem;
      color: #f5c518;
      font-weight: 700;
    }

    .channel {
      font-size: 0.68rem;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <header>
    <h1>MWJW<span>Free Movies from Public Broadcasters</span></h1>
    <div class="controls">
      <input id="search" type="search" placeholder="Search titles…" autocomplete="off">
      <div class="dropdown" id="sourceDropdown">
        <div class="dropdown-btn" id="dropdownBtn">Sources ▾</div>
        <div class="dropdown-menu">
          <label><input type="checkbox" value="arte.fr" checked> arte.fr</label>
          <label><input type="checkbox" value="arte.de" checked> arte.de</label>
          <label><input type="checkbox" value="3sat" checked> 3sat</label>
        </div>
      </div>
    </div>
  </header>
  <main>
    <div class="grid">
      {{CARDS}}
    </div>
  </main>
  <script>
    const input = document.getElementById('search');
    const grid = document.querySelector('.grid');
    const dropdown = document.getElementById('sourceDropdown');
    const dropdownBtn = document.getElementById('dropdownBtn');
    const checkboxes = dropdown.querySelectorAll('input[type=checkbox]');
    const allCards = [...document.querySelectorAll('.card')];

    // Sort cards by rating desc, inject into grid once
    allCards.sort((a, b) => parseFloat(b.dataset.rating) - parseFloat(a.dataset.rating));
    allCards.forEach(c => grid.appendChild(c));

    function applyFilters() {
      const q = input.value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      const active = new Set([...checkboxes].filter(c => c.checked).map(c => c.value));
      allCards.forEach(card => {
        const matchTitle = !q || card.dataset.title.includes(q);
        const matchSource = active.has(card.dataset.source);
        card.style.display = matchTitle && matchSource ? '' : 'none';
      });
    }

    input.addEventListener('input', applyFilters);
    checkboxes.forEach(cb => cb.addEventListener('change', applyFilters));

    // Toggle dropdown
    dropdownBtn.addEventListener('click', e => { e.stopPropagation(); dropdown.classList.toggle('open'); });
    document.addEventListener('click', () => dropdown.classList.remove('open'));
  </script>
</body>
</html>
