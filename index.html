<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kintoppix – Free Movies</title>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/video.js/dist/video-js.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e5e5e5;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      background: #0f0f0f;
      padding: 18px 32px;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
    }

    header h1 {
      font-family: 'Monoton', cursive;
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 4px;
      color: #c0392b;
    }

    header span {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: 400;
      color: #888;
      margin-left: 12px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }

    #search {
      background: #222;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e5e5e5;
      font-size: 0.9rem;
      padding: 7px 14px;
      width: 240px;
      outline: none;
    }

    #search::placeholder { color: #555; }
    #search:focus { border-color: #555; }

    .dropdown { position: relative; }

    .dropdown-btn {
      background: #222;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e5e5e5;
      font-size: 0.9rem;
      padding: 7px 14px;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }

    .dropdown-btn:hover { border-color: #555; }

    #sortSelect {
      background: #222;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e5e5e5;
      font-size: 0.9rem;
      padding: 7px 14px;
      outline: none;
      cursor: pointer;
    }

    #sortSelect:focus { border-color: #555; }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 8px 0;
      z-index: 100;
      min-width: 140px;
    }

    .dropdown.open .dropdown-menu { display: block; }

    .dropdown-menu label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #ccc;
      white-space: nowrap;
    }

    .dropdown-menu label:hover { background: #222; color: #fff; }
    .dropdown-menu input[type=checkbox] { accent-color: #e5e5e5; }

    main { padding: 32px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    .poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      background: #2a2a2a;
    }

    .poster-placeholder {
      width: 100%;
      aspect-ratio: 2/3;
      background: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: #555;
      text-align: center;
      padding: 12px;
    }

    .card-info { padding: 8px 10px 10px; }

    .card-title {
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e5e5e5;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .rating {
      font-size: 0.72rem;
      color: #f5c518;
      font-weight: 700;
    }

    .channel {
      font-size: 0.68rem;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .year {
      font-size: 0.68rem;
      color: #555;
      margin-left: auto;
    }

    .duration {
      font-size: 0.68rem;
      color: #555;
    }

    .rating.dim {
      color: #7a6a18;
      opacity: 0.5;
    }

    .genres {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
    }

    .card-poster {
      position: relative;
    }

    .info-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.25);
      color: #ccc;
      font-size: 0.65rem;
      font-style: italic;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .card:hover .info-btn { opacity: 1; }
    .info-btn:hover { background: rgba(0,0,0,0.85); color: #fff; }

    #player-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    #player-modal.open { display: flex; }

    #player-wrap {
      position: relative;
      width: 90vw;
      max-width: 960px;
    }

    #player-close {
      position: absolute;
      top: -32px;
      right: 0;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }

    .genre-tag {
      font-size: 0.62rem;
      color: #999;
      background: #2a2a2a;
      border-radius: 3px;
      padding: 2px 5px;
    }

    #langDropdown .dropdown-btn { min-width: 52px; text-align: center; font-weight: 600; letter-spacing: 1px; }
    #langDropdown .dropdown-menu label { cursor: pointer; font-weight: 600; letter-spacing: 1px; }
    #langDropdown .dropdown-menu label.active { color: #c0392b; }
  </style>
</head>
<body>
  <header>
    <h1>Kintoppix<span>Free Movies from Public Broadcasters</span></h1>
    <div class="controls">
      <select id="sortSelect">
        <option value="popularity">Sort: Popularity</option>
        <option value="rating">Sort: Rating</option>
      </select>
      <input id="search" type="search" placeholder="Search titles…" autocomplete="off">
      <div class="dropdown" id="genreDropdown">
        <div class="dropdown-btn" id="genreDropdownBtn">Genres ▾</div>
        <div class="dropdown-menu" id="genreMenu"></div>
      </div>
      <div class="dropdown" id="sourceDropdown">
        <div class="dropdown-btn" id="dropdownBtn">Sources ▾</div>
        <div class="dropdown-menu">
          <label><input type="checkbox" value="arte.fr" checked> arte.fr</label>
          <label><input type="checkbox" value="arte.de" checked> arte.de</label>
          <label><input type="checkbox" value="3sat" checked> 3sat</label>
          <label><input type="checkbox" value="ard" checked> ard</label>
          <label><input type="checkbox" value="srf" checked> srf</label>
        </div>
      </div>
      <div class="dropdown" id="langDropdown">
        <div class="dropdown-btn" id="langDropdownBtn">DE ▾</div>
        <div class="dropdown-menu">
          <label data-lang="de">DE</label>
          <label data-lang="fr">FR</label>
          <label data-lang="en">EN</label>
        </div>
      </div>
    </div>
  </header>
  <main>
    <div class="grid" id="grid"></div>
  </main>

  <div id="player-modal">
    <div id="player-wrap">
      <button id="player-close">✕</button>
      <video id="player" class="video-js vjs-big-play-centered vjs-fluid" controls preload="auto"></video>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/video.js/dist/video.min.js"></script>
  <script src="content.js?v=1773518301250"></script>
  <script>
    const grid = document.getElementById('grid');
    const input = document.getElementById('search');
    const sourceDropdown = document.getElementById('sourceDropdown');
    const dropdownBtn = document.getElementById('dropdownBtn');
    const sourceCheckboxes = sourceDropdown.querySelectorAll('input[type=checkbox]');
    const genreDropdown = document.getElementById('genreDropdown');
    const genreDropdownBtn = document.getElementById('genreDropdownBtn');
    const genreMenu = document.getElementById('genreMenu');

    // Build genre list from data
    const allGenreLabel = document.createElement('label');
    allGenreLabel.innerHTML = '<input type="checkbox" id="genreAll" checked> <span id="genreAllText">ALL</span>';
    allGenreLabel.style.borderBottom = '1px solid #333';
    allGenreLabel.style.marginBottom = '4px';
    allGenreLabel.style.paddingBottom = '8px';
    genreMenu.appendChild(allGenreLabel);
    const genreAllCb = document.getElementById('genreAll');

    const allGenres = [...new Set(MOVIES.flatMap(m => m.genres || []))].sort();
    allGenres.forEach(g => {
      const label = document.createElement('label');
      label.innerHTML = `<input type="checkbox" value="${g}" checked> <span data-genre-en="${g}">${g}</span>`;
      genreMenu.appendChild(label);
    });
    const genreCheckboxes = genreMenu.querySelectorAll('input[type=checkbox]:not(#genreAll)');

    genreAllCb.addEventListener('change', () => {
      genreCheckboxes.forEach(cb => cb.checked = genreAllCb.checked);
      applyFilters();
    });

    genreCheckboxes.forEach(cb => cb.addEventListener('change', () => {
      genreAllCb.checked = [...genreCheckboxes].every(c => c.checked);
      applyFilters();
    }));

    // VideoJS player setup
    const modal = document.getElementById('player-modal');
    const player = videojs('player', { fluid: true });

    function openPlayer(url) {
      player.src({ type: url.endsWith('m3u8') ? 'application/x-mpegURL' : undefined, src: url });
      player.load();
      modal.classList.add('open');
      player.play();
    }

    function closePlayer() {
      player.pause();
      player.src('');
      modal.classList.remove('open');
    }

    document.getElementById('player-close').addEventListener('click', closePlayer);
    modal.addEventListener('click', e => { if (e.target === modal) closePlayer(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayer(); });

    function buildCard(m) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = m.href;
      if (!m.hasDirectVideo) { a.target = '_blank'; a.rel = 'noopener'; }
      a.dataset.videoSrc = m.hasDirectVideo ? m.href : '';
      a.dataset.title = m.searchTitle;
      a.dataset.source = m.source;
      a.dataset.rating = m.rating;
      a.dataset.popularity = m.popularity;
      a.dataset.genres = (m.genres || []).join(',');

      const posterImg = m.poster
        ? `<img class="poster" src="${m.poster}" alt="${m.title}" loading="lazy">`
        : `<div class="poster-placeholder">${m.title}</div>`;

      const infoBtn = m.infoHref
        ? `<a class="info-btn" href="${m.infoHref}" target="_blank" rel="noopener" title="More info" onclick="event.stopPropagation()">i</a>`
        : '';

      const poster = `<div class="card-poster">${posterImg}${infoBtn}</div>`;

      const rating = m.rating !== '0'
        ? `<span class="rating${m.lowConfidence ? ' dim' : ''}">★ ${m.rating}</span>`
        : '';

      const year = m.year ? `<span class="year">${m.year}</span>` : '';
      const duration = m.duration ? `<span class="duration">${m.duration}</span>` : '';

      const genreTags = (m.genres || []).map(g => `<span class="genre-tag" data-genre-en="${g}">${g}</span>`).join('');

      a.innerHTML = `
        ${poster}
        <div class="card-info">
          <div class="card-title">${m.title}</div>
          <div class="card-meta">${rating}${duration}<span class="channel">${m.channel}</span>${year}</div>
          ${genreTags ? `<div class="genres">${genreTags}</div>` : ''}
        </div>`;
      if (m.hasDirectVideo) {
        a.addEventListener('click', e => {
          if (e.target.closest('.info-btn')) return;
          e.preventDefault();
          openPlayer(m.href);
        });
      }

      return a;
    }

    const sortSelect = document.getElementById('sortSelect');

    function getSortedCards() {
      const key = sortSelect.value;
      return [...MOVIES]
        .sort((a, b) => parseFloat(b[key]) - parseFloat(a[key]))
        .map(buildCard);
    }

    let cards = getSortedCards();
    cards.forEach(c => grid.appendChild(c));

    function reSort() {
      const key = sortSelect.value;
      [...cards].sort((a, b) => parseFloat(b.dataset[key]) - parseFloat(a.dataset[key]))
        .forEach(c => grid.appendChild(c));
    }

    sortSelect.addEventListener('change', reSort);

    function applyFilters() {
      const q = input.value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      const activeSources = new Set([...sourceCheckboxes].filter(c => c.checked).map(c => c.value));
      const activeGenres = new Set([...genreCheckboxes].filter(c => c.checked).map(c => c.value));
      const isAllSelected = genreAllCb.checked;
      cards.forEach(card => {
        const matchTitle = !q || card.dataset.title.includes(q);
        const matchSource = activeSources.has(card.dataset.source);
        const cardGenres = card.dataset.genres ? card.dataset.genres.split(',').filter(Boolean) : [];
        const hasNoGenres = cardGenres.length === 0;
        const matchGenre = isAllSelected
          ? true
          : !hasNoGenres && cardGenres.some(g => activeGenres.has(g));
        card.style.display = matchTitle && matchSource && matchGenre ? '' : 'none';
      });
    }

    input.addEventListener('input', applyFilters);
    sourceCheckboxes.forEach(cb => cb.addEventListener('change', applyFilters));
    genreCheckboxes.forEach(cb => cb.addEventListener('change', applyFilters));

    dropdownBtn.addEventListener('click', e => { e.stopPropagation(); sourceDropdown.classList.toggle('open'); });
    sourceDropdown.querySelector('.dropdown-menu').addEventListener('click', e => e.stopPropagation());
    genreDropdownBtn.addEventListener('click', e => { e.stopPropagation(); genreDropdown.classList.toggle('open'); });
    genreMenu.addEventListener('click', e => e.stopPropagation());
    document.addEventListener('click', () => {
      sourceDropdown.classList.remove('open');
      genreDropdown.classList.remove('open');
    });

    const I18N = {
      de: {
        subtitle: 'Kostenlose Filme aus öffentlich-rechtlichen Mediatheken',
        sortPopularity: 'Sortierung: Beliebtheit',
        sortRating: 'Sortierung: Bewertung',
        searchPlaceholder: 'Titel suchen…',
        genres: 'Genres ▾',
        sources: 'Sender ▾',
        all: 'ALLE',
        genreMap: { 'Action':'Action','Adventure':'Abenteuer','Animation':'Animation','Comedy':'Komödie','Crime':'Krimi','Documentary':'Dokumentarfilm','Drama':'Drama','Family':'Familie','Fantasy':'Fantasy','History':'Geschichte','Horror':'Horror','Music':'Musik','Mystery':'Mystery','Romance':'Romantik','Science Fiction':'Science-Fiction','TV Movie':'TV-Film','Thriller':'Thriller','War':'Kriegsfilm','Western':'Western' }
      },
      fr: {
        subtitle: 'Films gratuits des chaînes publiques européennes',
        sortPopularity: 'Tri : Popularité',
        sortRating: 'Tri : Note',
        searchPlaceholder: 'Rechercher des titres…',
        genres: 'Genres ▾',
        sources: 'Chaînes ▾',
        all: 'TOUS',
        genreMap: { 'Action':'Action','Adventure':'Aventure','Animation':'Animation','Comedy':'Comédie','Crime':'Policier','Documentary':'Documentaire','Drama':'Drame','Family':'Famille','Fantasy':'Fantastique','History':'Histoire','Horror':'Horreur','Music':'Musique','Mystery':'Mystère','Romance':'Romance','Science Fiction':'Science-fiction','TV Movie':'Téléfilm','Thriller':'Thriller','War':'Guerre','Western':'Western' }
      },
      en: {
        subtitle: 'Free Movies from Public Broadcasters',
        sortPopularity: 'Sort: Popularity',
        sortRating: 'Sort: Rating',
        searchPlaceholder: 'Search titles…',
        genres: 'Genres ▾',
        sources: 'Sources ▾',
        all: 'ALL',
        genreMap: {}
      }
    };

    const langDropdown = document.getElementById('langDropdown');
    const langDropdownBtn = document.getElementById('langDropdownBtn');

    function setLang(lang) {
      const t = I18N[lang];
      document.querySelector('header h1 span').textContent = t.subtitle;
      sortSelect.options[0].textContent = t.sortPopularity;
      sortSelect.options[1].textContent = t.sortRating;
      input.placeholder = t.searchPlaceholder;
      genreDropdownBtn.textContent = t.genres;
      dropdownBtn.textContent = t.sources;
      document.getElementById('genreAllText').textContent = t.all;
      document.querySelectorAll('[data-genre-en]').forEach(el => {
        el.textContent = t.genreMap[el.dataset.genreEn] || el.dataset.genreEn;
      });
      langDropdownBtn.textContent = lang.toUpperCase() + ' ▾';
      langDropdown.querySelectorAll('[data-lang]').forEach(el => {
        el.classList.toggle('active', el.dataset.lang === lang);
      });
      langDropdown.classList.remove('open');
    }

    langDropdownBtn.addEventListener('click', e => { e.stopPropagation(); langDropdown.classList.toggle('open'); });
    langDropdown.querySelector('.dropdown-menu').addEventListener('click', e => e.stopPropagation());
    langDropdown.querySelectorAll('[data-lang]').forEach(el => {
      el.addEventListener('click', () => setLang(el.dataset.lang));
    });
    document.addEventListener('click', () => { langDropdown.classList.remove('open'); });

    setLang('de');
  </script>
</body>
</html>
