<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="f96685e1-3f63-495e-846b-1186d083b81b"></script>
  <title>Kintoppix – Free Movies</title>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/video.js/dist/video-js.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Kintoppix<span>Free Movies from Public Broadcasters</span></h1>
    <div class="controls">
      <input id="search" type="search" placeholder="Search titles…" autocomplete="off">
      <select id="sortSelect">
        <option value="popularity">Sort: Popularity</option>
        <option value="rating">Sort: Rating</option>
        <option value="timestamp">Sort: Date</option>
      </select>
      <div class="dropdown" id="genreDropdown">
        <div class="dropdown-btn" id="genreDropdownBtn">Genres ▾</div>
        <div class="dropdown-menu" id="genreMenu"></div>
      </div>
      <div class="dropdown" id="sourceDropdown">
        <div class="dropdown-btn" id="dropdownBtn">Sources ▾</div>
        <div class="dropdown-menu">
          <label id="sourceAllLabel" style="border-bottom:1px solid #333;margin-bottom:4px;padding-bottom:8px"><input type="checkbox" id="sourceAll" checked> <span id="sourceAllText">ALL</span></label>
          <label><input type="checkbox" value="arte.fr" checked> arte.fr</label>
          <label><input type="checkbox" value="arte.de" checked> arte.de</label>
          <label><input type="checkbox" value="3sat" checked> 3sat</label>
          <label><input type="checkbox" value="ard" checked> ard</label>
          <label><input type="checkbox" value="srf" checked> srf</label>
        </div>
      </div>
      <div class="dropdown" id="langDropdown">
        <div class="dropdown-btn" id="langDropdownBtn">DE ▾</div>
        <div class="dropdown-menu">
          <label data-lang="de">DE</label>
          <label data-lang="fr">FR</label>
          <label data-lang="en">EN</label>
        </div>
      </div>
    </div>
  </header>
  <main>
    <div class="grid" id="grid"></div>
  </main>
  <footer>
    Video data provided by <a href="https://mediathekviewweb.de" target="_blank" rel="noopener">MediathekViewWeb</a>.
    Movie metadata and artwork from <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDb</a> — this product uses the TMDb API but is not endorsed or certified by TMDb.
    · <a href="info.html">Mentions légales / Impressum</a>
  </footer>

  <div id="player-modal">
    <div id="player-wrap">
      <button id="player-close">✕</button>
      <video id="player" class="video-js vjs-big-play-centered vjs-fluid" controls preload="auto"></video>
    </div>
  </div>

  <div id="detail-modal">
    <div id="detail-wrap">
      <button id="detail-close">✕</button>
      <div id="detail-body">
        <div id="detail-poster">
          <img id="detail-img" src="" alt="">
        </div>
        <h2 id="detail-title"></h2>
        <div id="detail-meta"></div>
        <p id="detail-overview"></p>
        <div id="detail-actions">
          <button id="detail-watch">▶ Watch</button>
          <div id="detail-alts"></div>
          <a id="detail-info-link" href="#" target="_blank" rel="noopener"></a>
        </div>
        <div id="detail-channel"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/video.js/dist/video.min.js"></script>
  <script src="content.js?v=1773569517272"></script>
  <script src="app.js"></script>
</body>
</html>
