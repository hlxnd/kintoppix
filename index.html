<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kintoppix – Free Movies</title>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/video.js/dist/video-js.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e5e5e5;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      background: #0f0f0f;
      padding: 18px 32px;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
    }

    header h1 {
      font-family: 'Monoton', cursive;
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 4px;
      color: #c0392b;
    }

    header span {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: 400;
      color: #888;
      margin-left: 12px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }

    #search {
      background: #222;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e5e5e5;
      font-size: 0.9rem;
      padding: 7px 14px;
      width: 240px;
      outline: none;
    }

    #search::placeholder { color: #555; }
    #search:focus { border-color: #555; }

    .dropdown { position: relative; }

    .dropdown-btn {
      background: #222;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e5e5e5;
      font-size: 0.9rem;
      padding: 7px 14px;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }

    .dropdown-btn:hover { border-color: #555; }

    #sortSelect {
      background: #222;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e5e5e5;
      font-size: 0.9rem;
      padding: 7px 14px;
      outline: none;
      cursor: pointer;
    }

    #sortSelect:focus { border-color: #555; }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 8px 0;
      z-index: 100;
      min-width: 140px;
    }

    .dropdown.open .dropdown-menu { display: block; }

    .dropdown-menu label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #ccc;
      white-space: nowrap;
    }

    .dropdown-menu label:hover { background: #222; color: #fff; }
    .dropdown-menu input[type=checkbox] { accent-color: #e5e5e5; }

    main { padding: 32px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    .poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      background: #2a2a2a;
    }

    .poster-placeholder {
      width: 100%;
      aspect-ratio: 2/3;
      background: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: #555;
      text-align: center;
      padding: 12px;
    }

    .card-info { padding: 8px 10px 10px; }

    .card-title {
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e5e5e5;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .rating {
      font-size: 0.72rem;
      color: #f5c518;
      font-weight: 700;
    }

    .channel {
      font-size: 0.68rem;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .year {
      font-size: 0.68rem;
      color: #555;
      margin-left: auto;
    }

    .duration {
      font-size: 0.68rem;
      color: #555;
    }

    .rating.dim {
      color: #7a6a18;
      opacity: 0.5;
    }

    .genres {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
    }

    .card-poster {
      position: relative;
    }


    #player-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    #player-modal.open { display: flex; }

    #player-wrap {
      position: relative;
      width: 90vw;
      max-width: 960px;
    }

    #player-close {
      position: absolute;
      top: -32px;
      right: 0;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }

    .genre-tag {
      font-size: 0.62rem;
      color: #999;
      background: #2a2a2a;
      border-radius: 3px;
      padding: 2px 5px;
    }

    footer {
      text-align: center;
      padding: 24px 32px;
      font-size: 0.72rem;
      color: #444;
      border-top: 1px solid #1a1a1a;
    }

    footer a { color: #555; text-decoration: none; }
    footer a:hover { color: #888; }

    #langDropdown .dropdown-btn { min-width: 52px; text-align: center; font-weight: 600; letter-spacing: 1px; }
    #langDropdown .dropdown-menu label { cursor: pointer; font-weight: 600; letter-spacing: 1px; }
    #langDropdown .dropdown-menu label.active { color: #c0392b; }

    @media (max-width: 640px) {
      header {
        flex-wrap: wrap;
        padding: 10px 14px;
        gap: 8px;
      }

      header h1 { font-size: 1.1rem; letter-spacing: 2px; }
      header span { display: none; }

      .controls {
        margin-left: 0;
        width: 100%;
        flex-wrap: wrap;
        gap: 8px;
      }

      /* Row 1: search full width */
      #search { width: 100%; flex: none; font-size: 0.85rem; padding: 7px 10px; }

      /* Row 2: sort + dropdowns */
      #sortSelect { flex: 1; min-width: 0; font-size: 0.8rem; padding: 6px 8px; }

      .dropdown-btn { font-size: 0.8rem; padding: 6px 10px; }

      /* Dropdown menus: scroll if too tall, open above on mobile to avoid clipping */
      .dropdown-menu { max-height: 50vh; overflow-y: auto; }

      main { padding: 10px; }

      .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .card-info { padding: 5px 6px 7px; }
      .card-title { font-size: 0.7rem; }
      .card-meta { gap: 4px; }
      .genres { display: none; }

      #detail-modal { padding: 0; align-items: flex-end; }

      #detail-wrap {
        flex-direction: column-reverse;
        max-width: 100%;
        max-height: 92vh;
        border-radius: 12px 12px 0 0;
        border-bottom: none;
      }

      #detail-poster {
        width: 100%;
        height: 220px;
        flex-shrink: 0;
      }

      #detail-body {
        padding: 20px 18px 18px;
      }

      #detail-body h2 { font-size: 1.2rem; margin-bottom: 8px; }

      #detail-overview { font-size: 0.82rem; }
    }

    #detail-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #detail-modal.open { display: flex; }

    #detail-wrap {
      position: relative;
      background: #181818;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
      width: 100%;
      max-width: 780px;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: row;
    }

    #detail-close {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(0,0,0,0.65);
      border: none;
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #detail-close:hover { background: rgba(0,0,0,0.9); }

    #detail-body {
      flex: 1;
      padding: 32px 28px 28px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #detail-body h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
      line-height: 1.2;
    }

    #detail-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: #aaa;
    }

    #detail-meta .d-rating { color: #f5c518; font-weight: 700; }
    #detail-meta .d-sep { color: #444; }

    #detail-overview {
      font-size: 0.85rem;
      line-height: 1.65;
      color: #ccc;
      margin-bottom: 20px;
      flex: 1;
    }

    #detail-actions { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }

    #detail-watch {
      background: #e5e5e5;
      color: #000;
      border: none;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 9px 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    #detail-watch:hover { background: #fff; }

    #detail-info-link {
      color: #aaa;
      font-size: 0.8rem;
      text-decoration: none;
    }

    #detail-info-link:hover { color: #fff; }

    #detail-channel {
      font-size: 0.72rem;
      color: #555;
    }

    #detail-poster {
      width: 200px;
      flex-shrink: 0;
      background: #111;
    }

    #detail-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <h1>Kintoppix<span>Free Movies from Public Broadcasters</span></h1>
    <div class="controls">
      <input id="search" type="search" placeholder="Search titles…" autocomplete="off">
      <select id="sortSelect">
        <option value="popularity">Sort: Popularity</option>
        <option value="rating">Sort: Rating</option>
      </select>
      <div class="dropdown" id="genreDropdown">
        <div class="dropdown-btn" id="genreDropdownBtn">Genres ▾</div>
        <div class="dropdown-menu" id="genreMenu"></div>
      </div>
      <div class="dropdown" id="sourceDropdown">
        <div class="dropdown-btn" id="dropdownBtn">Sources ▾</div>
        <div class="dropdown-menu">
          <label id="sourceAllLabel" style="border-bottom:1px solid #333;margin-bottom:4px;padding-bottom:8px"><input type="checkbox" id="sourceAll" checked> <span id="sourceAllText">ALL</span></label>
          <label><input type="checkbox" value="arte.fr" checked> arte.fr</label>
          <label><input type="checkbox" value="arte.de" checked> arte.de</label>
          <label><input type="checkbox" value="3sat" checked> 3sat</label>
          <label><input type="checkbox" value="ard" checked> ard</label>
          <label><input type="checkbox" value="srf" checked> srf</label>
        </div>
      </div>
      <div class="dropdown" id="langDropdown">
        <div class="dropdown-btn" id="langDropdownBtn">DE ▾</div>
        <div class="dropdown-menu">
          <label data-lang="de">DE</label>
          <label data-lang="fr">FR</label>
          <label data-lang="en">EN</label>
        </div>
      </div>
    </div>
  </header>
  <main>
    <div class="grid" id="grid"></div>
  </main>
  <footer>
    Video data provided by <a href="https://mediathekviewweb.de" target="_blank" rel="noopener">MediathekViewWeb</a>.
    Movie metadata and artwork from <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDb</a> — this product uses the TMDb API but is not endorsed or certified by TMDb.
    · <a href="/info.html">Mentions légales / Impressum</a>
  </footer>

  <div id="player-modal">
    <div id="player-wrap">
      <button id="player-close">✕</button>
      <video id="player" class="video-js vjs-big-play-centered vjs-fluid" controls preload="auto"></video>
    </div>
  </div>

  <div id="detail-modal">
    <div id="detail-wrap">
      <button id="detail-close">✕</button>
      <div id="detail-body">
        <h2 id="detail-title"></h2>
        <div id="detail-meta"></div>
        <p id="detail-overview"></p>
        <div id="detail-actions">
          <button id="detail-watch">▶ Watch</button>
          <a id="detail-info-link" href="#" target="_blank" rel="noopener"></a>
        </div>
        <div id="detail-channel"></div>
      </div>
      <div id="detail-poster">
        <img id="detail-img" src="" alt="">
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/video.js/dist/video.min.js"></script>
  <script src="content.js?v=1773522432733"></script>
  <script>
    const grid = document.getElementById('grid');
    const input = document.getElementById('search');
    const sourceDropdown = document.getElementById('sourceDropdown');
    const dropdownBtn = document.getElementById('dropdownBtn');
    const sourceAllCb = document.getElementById('sourceAll');
    const sourceCheckboxes = sourceDropdown.querySelectorAll('input[type=checkbox]:not(#sourceAll)');
    const genreDropdown = document.getElementById('genreDropdown');
    const genreDropdownBtn = document.getElementById('genreDropdownBtn');
    const genreMenu = document.getElementById('genreMenu');

    // Build genre list from data
    const allGenreLabel = document.createElement('label');
    allGenreLabel.innerHTML = '<input type="checkbox" id="genreAll" checked> <span id="genreAllText">ALL</span>';
    allGenreLabel.style.borderBottom = '1px solid #333';
    allGenreLabel.style.marginBottom = '4px';
    allGenreLabel.style.paddingBottom = '8px';
    genreMenu.appendChild(allGenreLabel);
    const genreAllCb = document.getElementById('genreAll');

    const allGenres = [...new Set(MOVIES.flatMap(m => m.genres || []))].sort();
    allGenres.forEach(g => {
      const label = document.createElement('label');
      label.innerHTML = `<input type="checkbox" value="${g}" checked> <span data-genre-en="${g}">${g}</span>`;
      genreMenu.appendChild(label);
    });
    const genreCheckboxes = genreMenu.querySelectorAll('input[type=checkbox]:not(#genreAll)');

    genreAllCb.addEventListener('change', () => {
      genreCheckboxes.forEach(cb => cb.checked = genreAllCb.checked);
      applyFilters();
    });

    genreCheckboxes.forEach(cb => cb.addEventListener('change', () => {
      genreAllCb.checked = [...genreCheckboxes].every(c => c.checked);
      applyFilters();
    }));

    // VideoJS player setup
    const modal = document.getElementById('player-modal');
    const player = videojs('player', { fluid: true });

    function openPlayer(url) {
      player.src({ type: url.endsWith('m3u8') ? 'application/x-mpegURL' : undefined, src: url });
      player.load();
      modal.classList.add('open');
      player.play();
    }

    function closePlayer() {
      player.pause();
      player.src('');
      modal.classList.remove('open');
    }

    document.getElementById('player-close').addEventListener('click', closePlayer);
    modal.addEventListener('click', e => { if (e.target === modal) closePlayer(); });

    // Detail modal
    const detailModal = document.getElementById('detail-modal');
    const detailImg = document.getElementById('detail-img');
    const detailTitle = document.getElementById('detail-title');
    const detailMeta = document.getElementById('detail-meta');
    const detailOverview = document.getElementById('detail-overview');
    const detailChannel = document.getElementById('detail-channel');
    const detailWatch = document.getElementById('detail-watch');
    const detailInfoLink = document.getElementById('detail-info-link');

    function openDetail(m) {
      if (m.poster) { detailImg.src = m.poster; detailImg.style.display = 'block'; }
      else { detailImg.style.display = 'none'; }

      detailTitle.textContent = m.title;

      const parts = [];
      if (m.year) parts.push(`<span>${m.year}</span>`);
      if (m.rating !== '0') parts.push(`<span class="d-rating">★ ${m.rating}</span>`);
      if (m.duration) parts.push(`<span>${m.duration}</span>`);
      if (m.genres && m.genres.length) {
        parts.push(`<span class="d-sep">·</span><span>${m.genres.map(g => {
          const t = I18N[currentLang];
          return t.genreMap[g] || g;
        }).join(', ')}</span>`);
      }
      detailMeta.innerHTML = parts.join('<span class="d-sep"> · </span>');

      detailOverview.textContent = m.overview || '';
      detailChannel.textContent = m.channel;

      const t = I18N[currentLang];
      detailWatch.innerHTML = `▶ ${m.hasDirectVideo ? t.watch : t.open}`;
      detailWatch.onclick = () => {
        closeDetail();
        if (m.hasDirectVideo) { openPlayer(m.href); }
        else { window.open(m.href, '_blank'); }
      };

      if (m.infoHref) {
        detailInfoLink.href = m.infoHref;
        detailInfoLink.textContent = t.moreInfo;
        detailInfoLink.style.display = '';
      } else {
        detailInfoLink.style.display = 'none';
      }

      detailModal.classList.add('open');
    }

    function closeDetail() { detailModal.classList.remove('open'); }

    document.getElementById('detail-close').addEventListener('click', closeDetail);
    detailModal.addEventListener('click', e => { if (e.target === detailModal) closeDetail(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePlayer(); closeDetail(); } });

    function buildCard(m) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = m.href;
      if (!m.hasDirectVideo) { a.target = '_blank'; a.rel = 'noopener'; }
      a.dataset.videoSrc = m.hasDirectVideo ? m.href : '';
      a.dataset.title = m.searchTitle;
      a.dataset.source = m.source;
      a.dataset.rating = m.rating;
      a.dataset.popularity = m.popularity;
      a.dataset.genres = (m.genres || []).join(',');

      const posterImg = m.poster
        ? `<img class="poster" src="${m.poster}" alt="${m.title}" loading="lazy">`
        : `<div class="poster-placeholder">${m.title}</div>`;

      const poster = `<div class="card-poster">${posterImg}</div>`;

      const rating = m.rating !== '0'
        ? `<span class="rating${m.lowConfidence ? ' dim' : ''}">★ ${m.rating}</span>`
        : '';

      const year = m.year ? `<span class="year">${m.year}</span>` : '';
      const duration = m.duration ? `<span class="duration">${m.duration}</span>` : '';

      const genreTags = (m.genres || []).map(g => `<span class="genre-tag" data-genre-en="${g}">${g}</span>`).join('');

      a.innerHTML = `
        ${poster}
        <div class="card-info">
          <div class="card-title">${m.title}</div>
          <div class="card-meta">${rating}${duration}<span class="channel">${m.channel}</span>${year}</div>
          ${genreTags ? `<div class="genres">${genreTags}</div>` : ''}
        </div>`;
      a.addEventListener('click', e => {
        e.preventDefault();
        openDetail(m);
      });

      return a;
    }

    const sortSelect = document.getElementById('sortSelect');

    function getSortedCards() {
      const key = sortSelect.value;
      return [...MOVIES]
        .sort((a, b) => parseFloat(b[key]) - parseFloat(a[key]))
        .map(buildCard);
    }

    let cards = getSortedCards();
    cards.forEach(c => grid.appendChild(c));

    function reSort() {
      const key = sortSelect.value;
      [...cards].sort((a, b) => parseFloat(b.dataset[key]) - parseFloat(a.dataset[key]))
        .forEach(c => grid.appendChild(c));
    }

    sortSelect.addEventListener('change', reSort);

    function applyFilters() {
      const q = input.value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      const activeSources = new Set([...sourceCheckboxes].filter(c => c.checked).map(c => c.value));
      const activeGenres = new Set([...genreCheckboxes].filter(c => c.checked).map(c => c.value));
      const isAllSelected = genreAllCb.checked;
      cards.forEach(card => {
        const matchTitle = !q || card.dataset.title.includes(q);
        const matchSource = activeSources.has(card.dataset.source);
        const cardGenres = card.dataset.genres ? card.dataset.genres.split(',').filter(Boolean) : [];
        const hasNoGenres = cardGenres.length === 0;
        const matchGenre = isAllSelected
          ? true
          : !hasNoGenres && cardGenres.some(g => activeGenres.has(g));
        card.style.display = matchTitle && matchSource && matchGenre ? '' : 'none';
      });
    }

    input.addEventListener('input', applyFilters);
    sourceAllCb.addEventListener('change', () => {
      sourceCheckboxes.forEach(cb => cb.checked = sourceAllCb.checked);
      applyFilters();
    });
    sourceCheckboxes.forEach(cb => cb.addEventListener('change', () => {
      sourceAllCb.checked = [...sourceCheckboxes].every(c => c.checked);
      applyFilters();
    }));
    genreCheckboxes.forEach(cb => cb.addEventListener('change', applyFilters));

    const langDropdown = document.getElementById('langDropdown');
    const langDropdownBtn = document.getElementById('langDropdownBtn');
    const allDropdowns = [sourceDropdown, genreDropdown, langDropdown];

    function openDropdown(dd) {
      allDropdowns.forEach(d => d.classList.toggle('open', d === dd ? !dd.classList.contains('open') : false));
    }

    dropdownBtn.addEventListener('click', e => { e.stopPropagation(); openDropdown(sourceDropdown); });
    sourceDropdown.querySelector('.dropdown-menu').addEventListener('click', e => e.stopPropagation());
    genreDropdownBtn.addEventListener('click', e => { e.stopPropagation(); openDropdown(genreDropdown); });
    genreMenu.addEventListener('click', e => e.stopPropagation());
    document.addEventListener('click', () => allDropdowns.forEach(d => d.classList.remove('open')));

    let currentLang = 'de';

    const I18N = {
      de: {
        subtitle: 'Kostenlose Filme aus öffentlich-rechtlichen Mediatheken',
        sortPopularity: 'Sortierung: Beliebtheit',
        sortRating: 'Sortierung: Bewertung',
        searchPlaceholder: 'Titel suchen…',
        genres: 'Genres ▾',
        sources: 'Sender ▾',
        all: 'ALLE',
        watch: 'Ansehen',
        open: 'Öffnen',
        moreInfo: 'Mehr Infos →',

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('kintoppix-lang', lang);
      const t = I18N[lang];
      document.querySelector('header h1 span').textContent = t.subtitle;
      sortSelect.options[0].textContent = t.sortPopularity;
      sortSelect.options[1].textContent = t.sortRating;
      input.placeholder = t.searchPlaceholder;
      genreDropdownBtn.textContent = t.genres;
      dropdownBtn.textContent = t.sources;
      document.getElementById('genreAllText').textContent = t.all;
      document.getElementById('sourceAllText').textContent = t.all;
      document.querySelectorAll('[data-genre-en]').forEach(el => {
        el.textContent = t.genreMap[el.dataset.genreEn] || el.dataset.genreEn;
      });
      langDropdownBtn.textContent = lang.toUpperCase() + ' ▾';
      langDropdown.querySelectorAll('[data-lang]').forEach(el => {
        el.classList.toggle('active', el.dataset.lang === lang);
      });
      langDropdown.classList.remove('open');
    }

    langDropdownBtn.addEventListener('click', e => { e.stopPropagation(); openDropdown(langDropdown); });
    langDropdown.querySelector('.dropdown-menu').addEventListener('click', e => e.stopPropagation());
    langDropdown.querySelectorAll('[data-lang]').forEach(el => {
      el.addEventListener('click', () => setLang(el.dataset.lang));
    });

    setLang(localStorage.getItem('kintoppix-lang') || 'de');
  </script>
